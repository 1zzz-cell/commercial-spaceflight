server {
    listen 80;
    server_name _;
    root /var/www/commercial-spaceflight;
    index index.html;

    error_page 404 /404.html;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }
}
